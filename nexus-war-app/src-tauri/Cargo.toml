[package]
name = "sky-magycc-judas"
version = "0.1.0"
description = "SKY-MAGYCC JUDAS - The Judas Protocol"
authors = ["Team SKY-MAGYCC"]
license = ""
repository = "https://github.com/suzukigame/Murder-mystery"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3" }
tauri-plugin-log = "2"
